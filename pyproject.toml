[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verityai"
version = "0.1.0"
description = "VerityAI - evidence-grounded, multi-source AI fact-checking platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aditya narayan" }]
keywords = ["fact-checking", "nlp", "retrieval", "nli", "evidence"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.5,<3.0",
  "pydantic-settings>=2.1,<3.0",
  "httpx>=0.27,<1.0",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "trafilatura>=1.6",
  "torch>=2.2",
  "transformers>=4.40,<5.0",
  "sentencepiece>=0.2",
  "sentence-transformers>=2.7,<4.0",
  "huggingface-hub>=0.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.4",
]
eval = [
  "datasets>=2.19,<3.0",
  "pandas>=2.2,<2.3",
  "scikit-learn>=1.4,<1.6",
  "pyarrow>=15,<18",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
  "live: tests that hit real external services (opt-in via -m live)",
]
addopts = '-q -m "not live"'

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "frontend", "experiments/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
